
name: Validate GitHub Secret Key

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  validate-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Validate if SECRET_KEY equals EXPECTED_SECRET_KEY
        run: |
          if [ "${{ secrets.SECRET_KEY }}" -eq "ACTIVITY" ]; then
            echo "SECRET_KEY matches EXPECTED_SECRET_KEY."
            echo "${{ secrets.SECRET_KEY }}"
            echo "${{ secrets.EXPECTED_SECRET_KEY }}"
          else
            echo "SECRET_KEY does NOT match EXPECTED_SECRET_KEY."
            exit 1
          fi
          
